<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CRISP-Agile Project Tracker</title>
<style>
:root{
  --blue-950:#062844;
  --blue-900:#0A335A;
  --blue-800:#0B3F70;
  --blue-700:#0D4D8C;
  --blue-600:#1468B3;
  --blue-500:#2F80D1;
  --blue-100:#EAF3FC;
  --blue-050:#F4F8FC;
  --ink:#172231;
  --muted:#66758A;
  --line:#D9E2EC;
  --bg:#F4F7FA;
  --white:#FFFFFF;
  --green:#21875A;
  --amber:#B97810;
  --red:#B43C3C;
  --shadow:0 10px 25px rgba(9,47,83,.08);
  --radius:14px;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--ink);
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}
.sidebar{
  background:linear-gradient(180deg,var(--blue-950),var(--blue-900));
  color:white;padding:22px 18px;position:sticky;top:0;height:100vh;overflow:auto
}
.brand{display:flex;gap:12px;align-items:center;margin-bottom:20px}
.logo{
  width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#2F80D1,#7CB7F2);
  display:grid;place-items:center;font-weight:800;font-size:18px;box-shadow:0 6px 16px rgba(0,0,0,.18)
}
.brand h1{font-size:16px;margin:0;line-height:1.15}
.brand small{opacity:.7}
.project-select{
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);
  border-radius:12px;padding:12px;margin-bottom:16px
}
.project-select label{display:block;font-size:11px;opacity:.7;margin-bottom:6px;text-transform:uppercase;letter-spacing:.08em}
.project-select select{
  width:100%;background:#fff;color:var(--ink);border:0;border-radius:8px;padding:9px
}
.nav{display:grid;gap:6px}
.nav button{
  width:100%;text-align:left;border:0;background:transparent;color:#EAF2FA;padding:11px 12px;border-radius:9px;
  display:flex;align-items:center;gap:10px
}
.nav button:hover,.nav button.active{background:rgba(255,255,255,.12);color:#fff}
.nav .ico{width:22px;text-align:center}
.sidebar-footer{margin-top:18px;border-top:1px solid rgba(255,255,255,.15);padding-top:14px;display:grid;gap:8px}
.sidebar-footer button{
  border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);color:#fff;padding:9px;border-radius:9px
}
.main{min-width:0}
.topbar{
  height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;
  padding:0 26px;position:sticky;top:0;z-index:10
}
.topbar .title h2{margin:0;font-size:20px}
.topbar .title p{margin:3px 0 0;color:var(--muted);font-size:12px}
.actions{display:flex;gap:8px;align-items:center}
.btn{
  border:0;border-radius:9px;padding:10px 14px;font-weight:650
}
.btn-primary{background:var(--blue-700);color:white}
.btn-primary:hover{background:var(--blue-800)}
.btn-light{background:var(--blue-100);color:var(--blue-800)}
.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn-danger{background:#FDECEC;color:var(--red)}
.content{padding:24px}
.view{display:none}
.view.active{display:block}
.grid{display:grid;gap:16px}
.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{
  background:#fff;border:1px solid #E2E9F0;border-radius:var(--radius);box-shadow:var(--shadow)
}
.card-pad{padding:18px}
.metric{padding:18px;position:relative;overflow:hidden}
.metric:after{
  content:"";position:absolute;right:-20px;bottom:-35px;width:100px;height:100px;border-radius:50%;background:var(--blue-100)
}
.metric .label{font-size:12px;color:var(--muted);margin-bottom:8px}
.metric .value{font-size:28px;font-weight:800;position:relative;z-index:1}
.metric .sub{font-size:12px;color:var(--muted);margin-top:5px;position:relative;z-index:1}
.section-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}
.section-head h3{margin:0;font-size:17px}
.section-head p{margin:4px 0 0;color:var(--muted);font-size:12px}
.progress{height:9px;background:#E9EFF5;border-radius:999px;overflow:hidden}
.progress > span{display:block;height:100%;background:linear-gradient(90deg,var(--blue-600),var(--blue-500));border-radius:999px}
.phase-card{padding:18px}
.phase-top{display:flex;gap:12px;align-items:flex-start}
.phase-num{width:34px;height:34px;border-radius:10px;background:var(--blue-100);color:var(--blue-800);display:grid;place-items:center;font-weight:800}
.phase-card h4{margin:0 0 3px;font-size:15px}
.phase-card p{margin:0;color:var(--muted);font-size:12px;line-height:1.45}
.phase-status{margin-left:auto}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:750}
.badge.todo{background:#EEF2F6;color:#58677B}
.badge.progressing{background:#EAF3FC;color:#145B96}
.badge.review{background:#FFF2D9;color:#8A5A00}
.badge.done{background:#E7F5EE;color:#18754C}
.badge.high{background:#FDECEC;color:#9D3030}
.badge.medium{background:#FFF2D9;color:#8A5A00}
.badge.low{background:#E7F5EE;color:#18754C}
.phase-progress{display:flex;align-items:center;gap:10px;margin-top:14px}
.phase-progress .progress{flex:1}
.phase-progress b{font-size:12px}
.phase-actions{display:flex;gap:8px;margin-top:14px}
.phase-actions button{padding:7px 9px;font-size:12px}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:11px 12px;border-bottom:1px solid #E8EDF2;text-align:left;font-size:12px;vertical-align:top}
th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;background:#FAFCFD;position:sticky;top:0}
tbody tr:hover{background:#FAFCFF}
.small{font-size:12px;color:var(--muted)}
.kicker{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--blue-700);font-weight:800}
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow:auto}
.column{background:#EDF2F6;border-radius:12px;padding:12px;min-height:260px}
.column h4{margin:0 0 10px;font-size:13px;display:flex;justify-content:space-between}
.task-card{background:#fff;border:1px solid #DDE5EC;border-radius:10px;padding:11px;margin-bottom:9px;box-shadow:0 3px 8px rgba(0,0,0,.03)}
.task-card h5{margin:0 0 8px;font-size:12px}
.task-meta{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:10px;border-radius:999px;padding:4px 7px;background:#EDF3F8;color:#4D6075}
.task-actions{display:flex;gap:6px;margin-top:9px}
.task-actions button{border:0;background:#F0F4F8;border-radius:7px;padding:5px 7px;font-size:10px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.toolbar input,.toolbar select{
  border:1px solid var(--line);border-radius:9px;background:#fff;padding:9px 10px
}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field label{display:block;font-size:11px;font-weight:750;color:#536273;margin-bottom:6px}
.field input,.field select,.field textarea{
  width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff;color:var(--ink)
}
.field textarea{min-height:95px;resize:vertical}
.full{grid-column:1/-1}
.modal{
  position:fixed;inset:0;background:rgba(4,28,50,.55);display:none;align-items:center;justify-content:center;padding:18px;z-index:100
}
.modal.open{display:flex}
.modal-box{background:white;border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.28);width:min(760px,96vw);max-height:88vh;overflow:auto}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
.modal-body{padding:18px 20px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line)}
.close{border:0;background:#F1F4F7;border-radius:8px;width:32px;height:32px}
.timeline{display:grid;gap:10px}
.timeline-item{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:start}
.timeline-date{font-size:11px;color:var(--muted);padding-top:8px}
.timeline-body{border-left:3px solid var(--blue-500);padding:9px 12px;background:#F8FBFE;border-radius:0 10px 10px 0}
.timeline-body b{font-size:12px}
.timeline-body p{font-size:12px;color:var(--muted);margin:4px 0 0}
.empty{padding:24px;text-align:center;color:var(--muted);font-size:12px}
.callout{
  padding:14px;border:1px solid #CFE1F3;background:#F4F9FE;border-radius:12px;color:#35536F;font-size:12px;line-height:1.5
}
.crisp-loop{
  display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:stretch
}
.loop-node{padding:12px;border-radius:11px;background:var(--blue-100);border:1px solid #CFE1F3;text-align:center;font-size:11px;font-weight:750;color:var(--blue-800)}
.loop-arrow{display:none}
.summary-list{display:grid;gap:8px}
.summary-item{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed #E2E7ED;font-size:12px}
.summary-item:last-child{border-bottom:0}
.note-card{padding:14px;border-left:4px solid var(--blue-600);background:#fff;border-radius:10px;border-top:1px solid #E4EAF0;border-right:1px solid #E4EAF0;border-bottom:1px solid #E4EAF0}
.note-card h5{margin:0 0 5px}
.note-card p{margin:0;color:var(--muted);font-size:12px;white-space:pre-wrap}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:white;padding:8px 11px;border-radius:9px;font-size:12px}
.tabs button.active{background:var(--blue-700);color:white;border-color:var(--blue-700)}
.mini-chart{height:120px;display:flex;align-items:flex-end;gap:10px;padding-top:18px}
.bar{flex:1;background:linear-gradient(180deg,var(--blue-500),var(--blue-700));border-radius:6px 6px 0 0;min-height:5px;position:relative}
.bar span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted);margin-bottom:4px}
.bar label{position:absolute;top:100%;left:50%;transform:translateX(-50%);font-size:9px;color:var(--muted);margin-top:5px;white-space:nowrap}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.mobile-nav{display:none}
@media(max-width:1080px){
  .grid-4{grid-template-columns:repeat(2,1fr)}
  .grid-3{grid-template-columns:repeat(2,1fr)}
  .crisp-loop{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:780px){
  .app{grid-template-columns:1fr}
  .sidebar{position:static;height:auto}
  .nav{grid-template-columns:repeat(2,1fr)}
  .topbar{position:static;height:auto;padding:16px;gap:10px;align-items:flex-start;flex-direction:column}
  .content{padding:14px}
  .grid-4,.grid-3,.grid-2,.form-grid{grid-template-columns:1fr}
  .board{grid-template-columns:repeat(4,260px)}
  .crisp-loop{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">CA</div>
      <div><h1>CRISP-Agile Tracker</h1><small>Data Project OS</small></div>
    </div>

    <div class="project-select">
      <label>Proyecto activo</label>
      <select id="projectSelector"></select>
    </div>

    <nav class="nav">
      <button class="active" data-view="dashboard"><span class="ico">◫</span>Dashboard</button>
      <button data-view="crisp"><span class="ico">◎</span>CRISP-DM</button>
      <button data-view="agile"><span class="ico">▦</span>Agile / Sprints</button>
      <button data-view="backlog"><span class="ico">☷</span>Backlog</button>
      <button data-view="kpis"><span class="ico">◒</span>KPIs</button>
      <button data-view="risks"><span class="ico">⚠</span>Riesgos</button>
      <button data-view="deliverables"><span class="ico">✓</span>Entregables</button>

      <button data-view="settings"><span class="ico">⚙</span>Proyecto</button>

    <div class="sidebar-footer">

      <button id="exportBtn">⇩ Exportar respaldo</button>
      <button id="importBtn">⇧ Importar respaldo</button>
      <input id="importFile" type="file" accept=".json" hidden />
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="title">
        <h2 id="pageTitle">Dashboard</h2>
        <p id="projectSubtitle">Seguimiento CRISP-DM + Agile</p>

      <div class="actions">
        <button class="btn btn-light" id="quickTaskBtn">＋ Tarea</button>
        <button class="btn btn-primary" id="quickSprintBtn">＋ Sprint</button>

    </header>

    <section class="content">
      <div id="dashboard" class="view active"></div>
      <div id="crisp" class="view"></div>
      <div id="agile" class="view"></div>
      <div id="backlog" class="view"></div>
      <div id="kpis" class="view"></div>
      <div id="risks" class="view"></div>
      <div id="deliverables" class="view"></div>
      <div id="notes" class="view"></div>
      <div id="team" class="view"></div>
      <div id="settings" class="view"></div>
    </section>
  </main>
</div>

<div id="modal" class="modal">
  <div class="modal-box">
    <div class="modal-head">
      <strong id="modalTitle">Nuevo elemento</strong>
      <button class="close" id="modalClose">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="modalCancel">Cancelar</button>
      <button class="btn btn-primary" id="modalSave">Guardar</button>
    </div>
  </div>
</div>

  "Al cierre de fase",

const fmt = d => d ? new Date(d+"T12:00:00").toLocaleDateString("es-MX",{day:"2-digit",month:"short",year:"numeric"}) : "—";

  id:uid(),
  name:"Danu Analítica – Proyecto de Ciencia de Datos",

if(!store.active) store.active = store.projects[0].id;
store.projects.forEach(p=>{

});
let currentView = "dashboard";
let modalState = null;

function save(){

}
function project(){

}
function phaseName(id){

function selectOptions(options,current="",placeholder="Seleccionar..."){
  const vals=[...options];
  if(current && !vals.includes(current)) vals.unshift(current);
  return `<option value="" ${!current?"selected":""}>${esc(placeholder)}</option>` + vals.map(v=>`<option value="${esc(v)}" ${current===v?"selected":""}>${esc(v)}</option>`).join("");
}
function ownerOptions(current=""){
  const names=["Equipo", ...project().team.map(m=>m.name).filter(Boolean)];

function calc(){
  const p=project();
  const total=p.tasks.length, done=p.tasks.filter(t=>t.status==="done").length;
  const overall= total ? Math.round(done/total*100) : 0;
  const activeSprint=p.sprints.find(s=>s.status==="active");
  const openRisks=p.risks.filter(r=>r.status!=="closed").length;
  const phaseStats=Object.fromEntries(PHASES.map(ph=>{
    const tasks=p.tasks.filter(t=>t.phase===ph.id);
    const d=tasks.filter(t=>t.status==="done").length;
    return [ph.id,{total:tasks.length,done:d,pct:tasks.length?Math.round(d/tasks.length*100):0}];
  }));
  return {total,done,overall,activeSprint,openRisks,phaseStats};
}

function openMember(id=null){
  const p=project(), m=p.team.find(x=>x.id===id)||{};
  openModal(id?"Editar persona":"Nueva persona",`
    <div class="form-grid">
      <div class="field full"><label>Nombre</label><input id="mMemberName" value="${esc(m.name||"")}" placeholder="Ej. Ana López"></div>
      <div class="field"><label>Rol</label><input id="mMemberRole" value="${esc(m.role||"")}" placeholder="Ej. Data Analyst"></div>
      <div class="field"><label>Email</label><input id="mMemberEmail" type="email" value="${esc(m.email||"")}" placeholder="nombre@correo.com"></div>
    </div>
  `,()=>{
    const name=$("#mMemberName").value.trim(); if(!name){alert("Agrega un nombre.");return;}
    const duplicate=p.team.some(x=>x.id!==id && x.name.toLowerCase()===name.toLowerCase());
    if(duplicate){alert("Ya existe una persona con ese nombre.");return;}
    const obj={id:id||uid(),name,role:$("#mMemberRole").value.trim(),email:$("#mMemberEmail").value.trim()};
    if(id){
      const old=p.team.find(x=>x.id===id);
      const oldName=old.name;
      Object.assign(old,obj);
      if(oldName!==name){
        [...p.tasks,...p.kpis,...p.risks].forEach(x=>{if(x.owner===oldName)x.owner=name;});
      }

function deleteMember(id){
  const p=project(), m=p.team.find(x=>x.id===id); if(!m)return;
  const refs=[...p.tasks,...p.kpis,...p.risks].filter(x=>x.owner===m.name).length;
  const extra=refs?`\n\nTiene ${refs} asignación(es). Esos registros pasarán a “Equipo”.`:"";
  if(!confirmDelete(`¿Eliminar a "${m.name}" del equipo?${extra}`))return;
  [...p.tasks,...p.kpis,...p.risks].forEach(x=>{if(x.owner===m.name)x.owner="Equipo";});

function deleteProject(){
  if(store.projects.length===1){alert("Debe existir al menos un proyecto.");return}
  if(!confirm("¿Eliminar este proyecto? Esta acción no se puede deshacer salvo que tengas un respaldo exportado."))return;
  store.projects=store.projects.filter(p=>p.id!==store.active);store.active=store.projects[0].id;save();setView("dashboard");
}
function exportData(){
  const blob=new Blob([JSON.stringify(store,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`crisp-agile-backup-${today()}.json`;a.click();URL.revokeObjectURL(a.href);
}
function importData(file){
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      if(!data.projects||!Array.isArray(data.projects))throw new Error("Formato inválido");
      store=data;if(!store.active)store.active=store.projects[0]?.id;save();render();alert("Respaldo importado correctamente.");
    }catch(e){alert("No se pudo importar el archivo.");}
  };
  reader.readAsText(file);
}
